<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>اختبار التواصل | مهارة</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >


  <style>

    /* إخفاء الصفحة حتى يتم فحص الحساب */

    body {
      visibility: hidden;
    }

    body.auth-ready {
      visibility: visible;
    }


    /* المستخدم */

    .user-area {
      display: flex;

      align-items: center;

      gap: 12px;
    }


    .user-name {
      color: #146b5a;

      font-size: 14px;

      font-weight: bold;
    }


    /* تسجيل الخروج */

    .logout-button {

      padding: 9px 14px;

      background: white;

      color: #56645f;

      border: 1px solid #dce4e2;

      border-radius: 8px;

      font-family: inherit;

      cursor: pointer;

      transition: 0.2s;
    }


    .logout-button:hover {

      color: white;

      background: #146b5a;

      border-color: #146b5a;

    }


    @media(max-width: 600px) {

      .user-name {
        display: none;
      }

    }

  </style>

</head>


<body>


<!-- =========================
     الهيدر
========================= -->

<header class="header">

  <div class="container navbar">


    <a
      href="index.html"
      class="logo"
    >

      <span>
        م
      </span>

      مهارة

    </a>


    <nav>

      <a href="course.html">

        العودة للمسار

      </a>

    </nav>


    <!-- المستخدم -->

    <div class="user-area">


      <span
        id="userName"
        class="user-name"
      >
      </span>


      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >

        تسجيل الخروج

      </button>


    </div>


  </div>

</header>



<!-- =========================
     عنوان الاختبار
========================= -->

<section class="page-header">

  <div class="container">


    <span>
      الاختبار النهائي
    </span>


    <h1>
      اختبر مهارات التواصل
    </h1>


    <p>
      اختر الإجابة الصحيحة لكل سؤال.
    </p>


  </div>

</section>



<!-- =========================
     الاختبار
========================= -->

<section class="section">

  <div class="container quiz-container">


    <form id="quizForm">


      <!-- السؤال الأول -->

      <div class="question">


        <h3>

          1. ما أهم عنصر في الاستماع الفعّال؟

        </h3>


        <label>

          <input
            type="radio"
            name="q1"
            value="0"
          >

          مقاطعة المتحدث

        </label>


        <label>

          <input
            type="radio"
            name="q1"
            value="1"
          >

          التركيز وفهم ما يقوله

        </label>


        <label>

          <input
            type="radio"
            name="q1"
            value="0"
          >

          التفكير في الرد فقط

        </label>


      </div>



      <!-- السؤال الثاني -->

      <div class="question">


        <h3>

          2. ماذا يمكن أن تعبر عنه لغة الجسد؟

        </h3>


        <label>

          <input
            type="radio"
            name="q2"
            value="1"
          >

          المشاعر والثقة

        </label>


        <label>

          <input
            type="radio"
            name="q2"
            value="0"
          >

          العمر فقط

        </label>


        <label>

          <input
            type="radio"
            name="q2"
            value="0"
          >

          لا تعبر عن شيء

        </label>


      </div>



      <!-- السؤال الثالث -->

      <div class="question">


        <h3>

          3. عند اختلافك مع شخص، الأفضل أن:

        </h3>


        <label>

          <input
            type="radio"
            name="q3"
            value="0"
          >

          ترفع صوتك

        </label>


        <label>

          <input
            type="radio"
            name="q3"
            value="0"
          >

          تنهي الحديث فوراً

        </label>


        <label>

          <input
            type="radio"
            name="q3"
            value="1"
          >

          تستمع وتشرح وجهة نظرك باحترام

        </label>


      </div>



      <!-- إنهاء الاختبار -->

      <button
        type="submit"
        class="button"
      >

        إنهاء الاختبار

      </button>


    </form>



    <!-- النتيجة -->

    <div
      id="quizResult"
      class="result hidden"
    >
    </div>


  </div>

</section>



<!-- =========================
     Firebase
========================= -->

<script
  src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
</script>


<script
  src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js">
</script>


<!-- إعداد Firebase -->

<script src="js/firebase.js"></script>



<!-- =========================
     حماية الاختبار
========================= -->

<script>


  auth.onAuthStateChanged(

    function(user) {


      /* غير مسجل */

      if (!user) {


        const fileName =

          window.location.pathname
            .split("/")
            .pop();


        const currentPage =

          fileName +

          window.location.search;


        /*
          نرسله إلى صفحة تسجيل الدخول
        */

        window.location.replace(

          "login.html?next=" +

          encodeURIComponent(
            currentPage
          )

        );


        return;

      }



      /* =========================
         المستخدم مسجل
      ========================= */


      document.body
        .classList
        .add(
          "auth-ready"
        );



      /* اسم المستخدم */

      const userName =

        document.getElementById(
          "userName"
        );


      if (user.displayName) {


        userName.textContent =

          "مرحباً، " +

          user.displayName;


      }


      else if (user.email) {


        userName.textContent =

          "مرحباً، " +

          user.email.split("@")[0];


      }


    }

  );



  /* =========================
     تسجيل الخروج
  ========================= */

  const logoutButton =

    document.getElementById(
      "logoutButton"
    );


  logoutButton.addEventListener(

    "click",

    async function() {


      logoutButton.disabled =
        true;


      logoutButton.textContent =
        "جاري الخروج...";


      try {


        await auth.signOut();


        window.location.replace(
          "index.html"
        );


      }


      catch(error) {


        console.error(
          "Logout error:",
          error
        );


        logoutButton.disabled =
          false;


        logoutButton.textContent =
          "تسجيل الخروج";


        alert(
          "حدث خطأ أثناء تسجيل الخروج."
        );


      }


    }

  );


</script>



<!-- =========================
     نظام الاختبار الحالي
========================= -->

<script src="js/app.js"></script>


</body>

</html>
