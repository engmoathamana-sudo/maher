<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>اختبار التواصل | مهارة</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>


<header class="header">

  <div class="container navbar">

    <a href="index.html" class="logo">
      <span>م</span>
      مهارة
    </a>

    <nav>
      <a href="course.html">
        العودة للمسار
      </a>
    </nav>

  </div>

</header>


<section class="page-header">

  <div class="container">

    <span>
      الاختبار النهائي
    </span>

    <h1>
      اختبر مهارات التواصل
    </h1>

    <p>
      اختر الإجابة الصحيحة لكل سؤال.
    </p>

  </div>

</section>


<section class="section">

  <div class="container quiz-container">


    <form id="quizForm">


      <div class="question">

        <h3>
          1. ما أهم عنصر في الاستماع الفعّال؟
        </h3>

        <label>
          <input
            type="radio"
            name="q1"
            value="0"
          >
          مقاطعة المتحدث
        </label>

        <label>
          <input
            type="radio"
            name="q1"
            value="1"
          >
          التركيز وفهم ما يقوله
        </label>

        <label>
          <input
            type="radio"
            name="q1"
            value="0"
          >
          التفكير في الرد فقط
        </label>

      </div>



      <div class="question">

        <h3>
          2. ماذا يمكن أن تعبر عنه لغة الجسد؟
        </h3>

        <label>
          <input
            type="radio"
            name="q2"
            value="1"
          >
          المشاعر والثقة
        </label>

        <label>
          <input
            type="radio"
            name="q2"
            value="0"
          >
          العمر فقط
        </label>

        <label>
          <input
            type="radio"
            name="q2"
            value="0"
          >
          لا تعبر عن شيء
        </label>

      </div>



      <div class="question">

        <h3>
          3. عند اختلافك مع شخص، الأفضل أن:
        </h3>

        <label>
          <input
            type="radio"
            name="q3"
            value="0"
          >
          ترفع صوتك
        </label>

        <label>
          <input
            type="radio"
            name="q3"
            value="0"
          >
          تنهي الحديث فوراً
        </label>

        <label>
          <input
            type="radio"
            name="q3"
            value="1"
          >
          تستمع وتشرح وجهة نظرك باحترام
        </label>

      </div>


      <button
        type="submit"
        class="button"
      >
        إنهاء الاختبار
      </button>

    </form>


    <div
      id="quizResult"
      class="result hidden"
    ></div>


  </div>

</section>


<script src="js/app.js"></script>

</body>
</html>
