<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الدرس | مهارة</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">

  <div class="container navbar">

    <a href="index.html" class="logo">
      <span>م</span>
      مهارة
    </a>

    <nav>
      <a href="course.html">
        العودة للمسار
      </a>
    </nav>

  </div>

</header>


<main class="lesson-page">

  <div class="container lesson-layout">


    <article class="lesson-content">

      <span id="lessonLabel" class="badge">
        الدرس
      </span>

      <h1 id="lessonTitle">
        جاري تحميل الدرس...
      </h1>

      <div id="lessonBody"></div>


      <div class="lesson-actions">

        <a
          href="course.html"
          class="secondary-button"
        >
          العودة للمسار
        </a>

        <button
          id="completeLesson"
          class="button"
        >
          أكملت هذا الدرس ✓
        </button>

      </div>

    </article>


    <aside class="side-card">

      <span>
        تقدم المسار
      </span>

      <h2 id="lessonProgressText">
        0%
      </h2>

      <div class="big-progress">
        <div id="lessonProgress"></div>
      </div>

      <p>
        يتم حفظ تقدمك تلقائياً
        على هذا الجهاز.
      </p>

    </aside>


  </div>

</main>


<script src="js/app.js"></script>

</body>
</html>
